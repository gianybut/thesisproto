<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in · Labelling</title>
<style>
  body { margin: 0; font: 15px/1.45 system-ui, "Segoe UI", sans-serif; color: #1E293B; background: #F6F8FB;
         display: grid; place-items: center; min-height: 100vh; }
  form { background: #fff; border: 1px solid #E2E8F0; border-radius: 8px; padding: 24px; width: min(340px, 92vw); }
  h1 { font-size: 20px; margin: 0 0 16px; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  select, input, button { font: inherit; width: 100%; padding: 8px; border: 1px solid #94A3B8; border-radius: 6px; box-sizing: border-box; }
  button { margin-top: 18px; background: #3B6FA8; color: #fff; border-color: #3B6FA8; font-weight: 600; cursor: pointer; }
  .err { color: #B42318; font-weight: 600; min-height: 1.4em; margin-top: 10px; }
</style>
</head>
<body>
<form id="f">
  <h1>Road damage labelling</h1>
  <label for="user">Your name</label>
  <select id="user" required>
    <option value="" selected disabled>Choose…</option>
    <option>Gian</option><option>Janmikael</option><option>Kyle</option>
  </select>
  <label for="pass">Team passcode</label>
  <input id="pass" type="password" autocomplete="current-password" required>
  <button>Sign in</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const r = await fetch('/api/login', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({user: document.getElementById('user').value, passcode: document.getElementById('pass').value})});
  if (r.ok) location.href = '/';
  else document.getElementById('err').textContent = (await r.json()).error;
};
</script>
</body>
</html>
